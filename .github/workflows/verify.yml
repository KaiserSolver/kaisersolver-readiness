name: verify

# Every push re-derives every checksum in the record: a report, run.json or
# index that drifted from its digest fails the build.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sha256sum -c SHA256SUMS
      - run: for f in runs/*/*/SHA256SUMS; do (cd "$(dirname "$f")" && sha256sum -c SHA256SUMS); done
      - run: python3 tools/verify.py
      - run: pip install pytest && python3 -m pytest -q tools
